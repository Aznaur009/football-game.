<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Настольный футбол</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
  touch-action: none;
}
#bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(94vw, 440px);
  margin: 8px auto;
  height: 56px;
}
.team {
  flex: 1;
  font-size: 15px;
  font-weight: bold;
  line-height: 1.15;
  padding: 4px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  cursor: pointer;
}
.team .fl { font-size: 24px; display: block; }
.team small { font-size: 14px; margin-left: 4px; }
#mid { flex: 0 0 96px; }
#score { font-size: 26px; font-weight: bold; line-height: 1.1; }
#timer { font-size: 15px; font-weight: bold; color: #9fe3b0; }
#tools { display: flex; justify-content: center; gap: 10px; margin: 8px auto 0; height: 36px; }
.chip { border: 0; border-radius: 10px; padding: 0 16px; font-size: 15px; font-weight: bold; background: #168cff; color: #fff; }
#sndBtn { background: rgba(255,255,255,0.15); }
#picker { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 10; }
#sheet { width: min(94vw, 440px); max-height: 84dvh; overflow: auto; background: #16222e; border-radius: 16px; padding: 12px; touch-action: pan-y; }
#sheet h3 { margin: 4px 0 10px; font-size: 17px; }
#grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cc { border: 2px solid transparent; border-radius: 10px; padding: 8px 4px; background: rgba(255,255,255,0.08); color: #fff; font-size: 12px; font-weight: bold; }
.cc span { display: block; font-size: 28px; }
.cc.cur { border-color: #ffe45c; }
.cc:disabled { opacity: 0.3; }
canvas {
  display: block;
  width: min(94vw, calc((100dvh - 132px) * 4 / 7));
  height: auto;
  margin: 0 auto;
  border: 3px solid white;
  border-radius: 12px;
  touch-action: none;
  background: #238447;
}
</style>
</head>
<body>

<div id="bar">
  <div class="team" id="n1"></div>
  <div id="mid"><div id="score">0 : 0</div><div id="timer">0:00</div></div>
  <div class="team" id="n2"></div>
</div>

<canvas id="game" width="400" height="700"></canvas>

<div id="tools">
  <button class="chip" id="modeBtn"></button>
  <button class="chip" id="sndBtn"></button>
</div>

<div id="picker">
  <div id="sheet">
    <h3>Выберите страну</h3>
    <div id="grid"></div>
  </div>
</div>

<script>
// Интеграция с Telegram Mini App (в обычном браузере просто пропускается)
try {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); // чтобы свайп по полю не закрывал игру
    if (tg.setHeaderColor) tg.setHeaderColor("#101820");
    if (tg.setBackgroundColor) tg.setBackgroundColor("#101820");
  }
} catch (_) {}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

const W = 400, H = 700, R = 27, BR = 16, WIN_SCORE = 10;
const GOAL_X1 = 115, GOAL_X2 = 285; // ширина ворот 170
const TOP = 26, BOT = 674;          // линии ворот; за ними — сетка глубиной 26
const ICE_AT = 5, FIRE_AT = 9;      // с какого гола команда получает ледяной / огненный удар
let elapsed = 0, mode = "ai", muted = false, matchOver = false, lastTs = 0, pickerOpen = false;
const specials = { blue: {ice:false, fire:false}, red: {ice:false, fire:false} };

// ---------- Страны ----------
const COUNTRIES = [
  {name:"Франция",  emoji:"🇫🇷", type:"stripes", dir:"v", colors:["#0055A4","#ffffff","#EF4135"]},
  {name:"Германия", emoji:"🇩🇪", type:"stripes", dir:"h", colors:["#000000","#DD0000","#FFCE00"]},
  {name:"Италия",   emoji:"🇮🇹", type:"stripes", dir:"v", colors:["#009246","#ffffff","#CE2B37"]},
  {name:"Испания",  emoji:"🇪🇸", type:"stripes", dir:"h", colors:["#AA151B","#F1BF00","#AA151B"], weights:[1,2,1]},
  {name:"Нидерланды",emoji:"🇳🇱", type:"stripes", dir:"h", colors:["#AE1C28","#ffffff","#21468B"]},
  {name:"Россия",   emoji:"🇷🇺", type:"stripes", dir:"h", colors:["#ffffff","#0039A6","#D52B1E"]},
  {name:"Украина",  emoji:"🇺🇦", type:"stripes", dir:"h", colors:["#0057B7","#FFD700"]},
  {name:"Польша",   emoji:"🇵🇱", type:"stripes", dir:"h", colors:["#ffffff","#DC143C"]},
  {name:"Португалия",emoji:"🇵🇹", type:"stripes", dir:"v", colors:["#006600","#FF0000"], weights:[2,3]},
  {name:"Аргентина",emoji:"🇦🇷", type:"stripes", dir:"h", colors:["#74ACDF","#ffffff","#74ACDF"]},
  {name:"Бразилия", emoji:"🇧🇷", type:"brazil"},
  {name:"Япония",   emoji:"🇯🇵", type:"disc", bg:"#ffffff", fg:"#BC002D"},
  {name:"Швеция",   emoji:"🇸🇪", type:"cross", bg:"#006AA7", fg:"#FECC00"},
  {name:"Бельгия",  emoji:"🇧🇪", type:"stripes", dir:"v", colors:["#000000","#FAE042","#ED2939"]},
  {name:"Мексика",  emoji:"🇲🇽", type:"stripes", dir:"v", colors:["#006847","#ffffff","#CE1126"]},
  {name:"Хорватия", emoji:"🇭🇷", type:"stripes", dir:"h", colors:["#FF0000","#ffffff","#171796"]},
  {name:"Дания",    emoji:"🇩🇰", type:"cross", bg:"#C8102E", fg:"#ffffff"},
  {name:"Турция",   emoji:"🇹🇷", type:"disc", bg:"#E30A17", fg:"#ffffff"},
  {name:"Швейцария",emoji:"🇨🇭", type:"cross", bg:"#D52B1E", fg:"#ffffff"},
  {name:"Колумбия", emoji:"🇨🇴", type:"stripes", dir:"h", colors:["#FCD116","#003893","#CE1126"], weights:[2,1,1]},
  {name:"Австрия",  emoji:"🇦🇹", type:"stripes", dir:"h", colors:["#ED2939","#ffffff","#ED2939"]},
  {name:"Ирландия", emoji:"🇮🇪", type:"stripes", dir:"v", colors:["#169B62","#ffffff","#FF883E"]},
  {name:"Греция",   emoji:"🇬🇷", type:"stripes", dir:"h", colors:["#0D5EAF","#ffffff","#0D5EAF","#ffffff","#0D5EAF"]},
  {name:"Сербия",   emoji:"🇷🇸", type:"stripes", dir:"h", colors:["#C6363C","#0C4076","#ffffff"]},
  {name:"Египет",   emoji:"🇪🇬", type:"stripes", dir:"h", colors:["#CE1126","#ffffff","#000000"]}
];

let teamCountry = {blue: 0, red: 1}; // индексы в COUNTRIES

function updateTeamLabels() {
  const a = COUNTRIES[teamCountry.blue], b = COUNTRIES[teamCountry.red];
  document.getElementById("n1").innerHTML = `<span class="fl">${a.emoji}<small id="b1"></small></span>${a.name}`;
  document.getElementById("n2").innerHTML = `<span class="fl">${b.emoji}<small id="b2"></small></span>${b.name}`;
  updateBadges();
}

// выбор страны: сетка флагов (занятая соперником страна недоступна)
function openPicker(team) {
  const other = team === "blue" ? "red" : "blue";
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  COUNTRIES.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "cc" + (i === teamCountry[team] ? " cur" : "");
    b.disabled = i === teamCountry[other];
    b.innerHTML = `<span>${c.emoji}</span>${c.name}`;
    b.onclick = () => {
      teamCountry[team] = i;
      updateTeamLabels();
      closePicker();
      draw();
    };
    grid.appendChild(b);
  });
  touches.clear();
  pickerOpen = true;
  document.getElementById("picker").style.display = "flex";
}
function closePicker() {
  pickerOpen = false;
  document.getElementById("picker").style.display = "none";
}
document.getElementById("n1").addEventListener("click", () => openPicker("blue"));
document.getElementById("n2").addEventListener("click", () => openPicker("red"));
document.getElementById("picker").addEventListener("click", e => {
  if (e.target.id === "picker") closePicker();
});

function drawFlagDisc(x, y, r, c) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();

  if (c.type === "stripes") {
    const w = c.weights || c.colors.map(() => 1);
    const sum = w.reduce((a, b) => a + b, 0);
    let pos = -r;
    c.colors.forEach((col, i) => {
      const size = 2 * r * w[i] / sum;
      ctx.fillStyle = col;
      if (c.dir === "h") ctx.fillRect(x - r, y + pos, 2 * r, size + 0.5);
      else ctx.fillRect(x + pos, y - r, size + 0.5, 2 * r);
      pos += size;
    });
  } else if (c.type === "brazil") {
    ctx.fillStyle = "#009C3B";
    ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    ctx.fillStyle = "#FFDF00";
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.78);
    ctx.lineTo(x + r * 0.78, y);
    ctx.lineTo(x, y + r * 0.78);
    ctx.lineTo(x - r * 0.78, y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#002776";
    ctx.beginPath();
    ctx.arc(x, y, r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  } else if (c.type === "disc") {
    ctx.fillStyle = c.bg;
    ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    ctx.fillStyle = c.fg;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (c.type === "cross") {
    ctx.fillStyle = c.bg;
    ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    ctx.fillStyle = c.fg;
    ctx.fillRect(x - r, y - r * 0.2, 2 * r, r * 0.4);
    ctx.fillRect(x - r * 0.2, y - r, r * 0.4, 2 * r);
  }
  ctx.restore();
}

// ---------- Состояние ----------
let blueScore = 0, redScore = 0;
let pauseTimer = 0;
let message = "";

const START = [
  {x:200,y:540,team:"blue"},
  {x:200,y:160,team:"red"}
];

const players = START.map(s => ({...s, tx:s.x, ty:s.y, frozen:0, stun:0, hitCool:0, kx:0, ky:0}));
const ball = {x:200, y:350, vx:0, vy:0, r:BR, rot:0, inNet:false, fx:null, fxTeam:null, fxT:0, trail:[]};

// палец -> фишка (мультитач: каждый палец двигает свою фишку)
const touches = new Map(); // pointerId -> {p, ox, oy}

// ---------- Отрисовка ----------
function drawGoal(x1, x2, top) {
  const w = x2 - x1;
  const d = TOP;                       // глубина сетки
  const y = top ? 0 : H - d;           // верх прямоугольника сетки
  const line = top ? d : H - d;        // линия ворот
  const back = top ? 0 : H;            // задняя стенка

  // тёмный «провал» за линией и тень от ворот
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(x1, y, w, d);

  // сетка
  ctx.save();
  ctx.beginPath();
  ctx.rect(x1, y, w, d);
  ctx.clip();
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= w; i += 8) {
    ctx.beginPath(); ctx.moveTo(x1 + i, y); ctx.lineTo(x1 + i, y + d); ctx.stroke();
  }
  for (let j = 0; j <= d; j += 8) {
    ctx.beginPath(); ctx.moveTo(x1, y + j); ctx.lineTo(x2, y + j); ctx.stroke();
  }
  // боковые стенки сетки (перспектива)
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.beginPath();
  ctx.moveTo(x1, line); ctx.lineTo(x1 + 10, back);
  ctx.moveTo(x2, line); ctx.lineTo(x2 - 10, back);
  ctx.stroke();
  ctx.restore();

  ctx.lineCap = "round";
  // боковые перекладины каркаса
  ctx.strokeStyle = "#cfd3d6";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x1, line); ctx.lineTo(x1, back);
  ctx.moveTo(x2, line); ctx.lineTo(x2, back);
  ctx.stroke();

  // тень и сама штанга-перекладина
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(x1, line + (top ? 3 : -3)); ctx.lineTo(x2, line + (top ? 3 : -3));
  ctx.stroke();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(x1, line); ctx.lineTo(x2, line); ctx.stroke();

  // стойки (вид сверху)
  [x1, x2].forEach(px => {
    ctx.beginPath();
    ctx.arc(px, line, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#8a9096";
    ctx.stroke();
  });
  ctx.lineCap = "butt";
}

function drawField() {
  ctx.fillStyle = "#238447";
  ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++) {
    ctx.fillStyle = i%2===0 ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.035)";
    ctx.fillRect(0,i*100,W,100);
  }
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.strokeRect(8,TOP,384,BOT-TOP);
  ctx.beginPath(); ctx.moveTo(8,350); ctx.lineTo(392,350); ctx.stroke();
  ctx.beginPath(); ctx.arc(200,350,65,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(200,350,4,0,Math.PI*2); ctx.fillStyle="white"; ctx.fill();
  // штрафные и вратарские площади
  ctx.strokeRect(60,TOP,280,120);
  ctx.strokeRect(60,BOT-120,280,120);
  ctx.strokeRect(GOAL_X1-15,TOP,GOAL_X2-GOAL_X1+30,45);
  ctx.strokeRect(GOAL_X1-15,BOT-45,GOAL_X2-GOAL_X1+30,45);
  // пенальти-точки
  ctx.fillStyle="white";
  ctx.beginPath(); ctx.arc(200,TOP+85,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(200,BOT-85,3.5,0,Math.PI*2); ctx.fill();
  drawGoal(GOAL_X1,GOAL_X2,true);
  drawGoal(GOAL_X1,GOAL_X2,false);
}

function isTouched(p) {
  for (const t of touches.values()) if (t.p === p) return true;
  return false;
}
// «Управляемая» фишка: держит палец или (в режиме против ПК) красная фишка компьютера
function isSelected(p) {
  if ((p.frozen || 0) > 0 || (p.stun || 0) > 0) return false; // заморожена или оглушена — не двигается
  return isTouched(p) || (mode === "ai" && p.team === "red");
}

function drawPlayer(p) {
  const c = COUNTRIES[teamCountry[p.team]];
  const sel = isTouched(p);

  // тень
  ctx.beginPath();
  ctx.arc(p.x+2, p.y+4, R, 0, Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fill();

  // свечение: у фишки есть заряд особого удара (огненный важнее ледяного)
  const sp = specials[p.team];
  const charged = sp.fire ? "fire" : (sp.ice ? "ice" : null);
  if (charged) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 160);
    ctx.save();
    ctx.shadowColor = charged === "fire" ? "#ff7a1a" : "#7fd8ff";
    ctx.shadowBlur = 14 + 14 * pulse;
    ctx.beginPath();
    ctx.arc(p.x, p.y, R + 3, 0, Math.PI*2);
    ctx.fillStyle = charged === "fire" ? "rgba(255,122,26,0.55)" : "rgba(127,216,255,0.55)";
    ctx.fill();
    ctx.restore();
  }

  drawFlagDisc(p.x, p.y, R, c);

  ctx.beginPath();
  ctx.arc(p.x, p.y, R, 0, Math.PI*2);
  ctx.lineWidth = sel ? 5 : 3;
  ctx.strokeStyle = sel ? "#ffe45c" : "white";
  ctx.stroke();

  // состояния: заморожена льдом / оглушена огнём
  if ((p.frozen || 0) > 0 || (p.stun || 0) > 0) {
    const ice = (p.frozen || 0) > 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, R, 0, Math.PI*2);
    ctx.fillStyle = ice ? "rgba(150,220,255,0.65)" : "rgba(255,120,20,0.5)";
    ctx.fill();
    ctx.font = "22px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ice ? "❄️" : "🔥", p.x, p.y + 1);
  }
}

function poly(cx, cy, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = rot + i * Math.PI * 2 / 5;
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawBall() {
  const r = ball.r;

  // особый удар: шлейф и свечение
  if (ball.fx) {
    const col = ball.fx === "fire" ? "255,120,20" : "127,216,255";
    ball.trail.forEach((t, i, arr) => {
      const k = (i + 1) / arr.length;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r * (0.4 + 0.6 * k), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${col},${0.4 * k})`;
      ctx.fill();
    });
    ctx.save();
    ctx.shadowColor = `rgb(${col})`;
    ctx.shadowBlur = 26;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, r + 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${col},0.7)`;
    ctx.fill();
    ctx.restore();
  }

  // тень на траве
  ctx.beginPath();
  ctx.ellipse(ball.x + 3, ball.y + r * 0.8, r * 0.95, r * 0.55, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fill();

  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.clip();

  // основа с объёмом
  const g = ctx.createRadialGradient(-r*0.35, -r*0.4, r*0.1, 0, 0, r);
  g.addColorStop(0, "#ffffff");
  g.addColorStop(1, "#d3d6d9");
  ctx.fillStyle = g;
  ctx.fillRect(-r, -r, 2*r, 2*r);

  // вращающийся рисунок: центральный пятиугольник, швы и соседние панели
  ctx.rotate(ball.rot);
  ctx.fillStyle = "#1c1c1c";
  poly(0, 0, r * 0.4, -Math.PI / 2);
  ctx.fill();

  ctx.strokeStyle = "#555";
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4);
    ctx.lineTo(Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.78);
    ctx.stroke();

    const b = a + Math.PI / 5;
    ctx.fillStyle = "#1c1c1c";
    poly(Math.cos(b) * r * 1.12, Math.sin(b) * r * 1.12, r * 0.42, b + Math.PI);
    ctx.fill();
  }
  ctx.rotate(-ball.rot);

  // затенение по краю и блик
  const sh = ctx.createRadialGradient(-r*0.3, -r*0.35, r*0.3, 0, 0, r);
  sh.addColorStop(0, "rgba(0,0,0,0)");
  sh.addColorStop(1, "rgba(0,0,0,0.3)");
  ctx.fillStyle = sh;
  ctx.fillRect(-r, -r, 2*r, 2*r);

  ctx.beginPath();
  ctx.ellipse(-r*0.35, -r*0.4, r*0.28, r*0.16, -0.7, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "#2a2a2a";
  ctx.stroke();
}

function drawMessage() {
  if (!message) return;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 300, W, 100);
  ctx.fillStyle = "white";
  ctx.font = "bold 28px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const lines = message.split("\n");
  lines.forEach((ln, i) => ctx.fillText(ln, W/2, 350 + (i - (lines.length - 1) / 2) * 38));
}

function draw() {
  drawField();
  players.forEach(drawPlayer);
  drawBall();
  drawMessage();
}

// ---------- Управление пальцем ----------
function getPosition(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x:(e.clientX-rect.left)*canvas.width/rect.width,
    y:(e.clientY-rect.top)*canvas.height/rect.height
  };
}

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  initAudio(); // браузеры разрешают звук только после касания
  if (pauseTimer > 0) return;
  const pos = getPosition(e);

  let best = null, bestD = R + 14;
  for (const p of players) {
    if (isSelected(p) || (p.frozen || 0) > 0 || (p.stun || 0) > 0) continue;
    const d = Math.hypot(pos.x-p.x, pos.y-p.y);
    if (d < bestD) { best = p; bestD = d; }
  }
  if (best) {
    touches.set(e.pointerId, {p: best, ox: best.x - pos.x, oy: best.y - pos.y});
    best.tx = best.x; best.ty = best.y;
    try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
  }
});

canvas.addEventListener("pointermove", e => {
  const t = touches.get(e.pointerId);
  if (!t) return;
  e.preventDefault();
  const pos = getPosition(e);
  t.p.tx = pos.x + t.ox;
  t.p.ty = pos.y + t.oy;
});

function release(e) { touches.delete(e.pointerId); initAudio(); }
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);

// ---------- Звук (синтезируется, внешних файлов нет) ----------
let audioCtx = null, lastSnd = 0;

function initAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (_) {}
}

function tone(freq, dur, type, vol, slideTo, delay) {
  if (!audioCtx || muted) return;
  delay = delay || 0;
  const t = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function noise(dur, vol, ftype, freq, delay, attack) {
  if (!audioCtx || muted) return;
  delay = delay || 0;
  const t = audioCtx.currentTime + delay;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type = ftype;
  f.frequency.value = freq;
  const g = audioCtx.createGain();
  if (attack) {
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
  } else {
    g.gain.setValueAtTime(vol, t);
  }
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f);
  f.connect(g);
  g.connect(audioCtx.destination);
  src.start(t);
}

// удар по мячу фишкой
function kickSound(impact) {
  if (!audioCtx || impact < 1.2) return;
  const now = performance.now();
  if (now - lastSnd < 70) return;
  lastSnd = now;
  const v = Math.min(1, impact / 12);
  tone(170, 0.12, "sine", 0.08 + 0.35 * v, 55);
  noise(0.06, 0.05 + 0.25 * v, "lowpass", 1500);
}

// отскок мяча от борта
function wallSound(speed) {
  if (!audioCtx || speed < 1.5) return;
  const now = performance.now();
  if (now - lastSnd < 70) return;
  lastSnd = now;
  const v = Math.min(1, speed / 12);
  tone(300, 0.07, "triangle", 0.05 + 0.2 * v, 180);
}

// гол: свисток и рёв трибун
function goalSound() {
  tone(2000, 0.22, "sine", 0.12, 2300);
  tone(2300, 0.35, "sine", 0.12, 2000, 0.22);
  noise(1.5, 0.25, "bandpass", 900, 0, 0.35);
}

// победа: фанфары и аплодисменты
function winSound() {
  [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, "triangle", 0.2, null, i * 0.16));
  tone(1047, 0.7, "triangle", 0.2, null, 0.64);
  noise(2.4, 0.28, "bandpass", 1200, 0, 0.4);
}

// ---------- Особые удары ----------
function iceSound()    { tone(2200, 0.35, "triangle", 0.15, 700); noise(0.3, 0.18, "highpass", 5000); }
function fireSound()   { noise(0.6, 0.35, "lowpass", 1100, 0, 0.05); tone(110, 0.6, "sawtooth", 0.14, 420); }
function freezeSound() { tone(3000, 0.12, "square", 0.07, 1800); tone(2000, 0.2, "triangle", 0.1, 900, 0.08); }
function burnSound()   { noise(0.35, 0.3, "lowpass", 800); }

function updateBadges() {
  ["blue", "red"].forEach((team, i) => {
    const el = document.getElementById("b" + (i + 1));
    if (el) el.textContent = (specials[team].fire ? "🔥" : "") + (specials[team].ice ? "❄️" : "");
  });
}

// Заряд тратится на первом сильном ударе своей движущейся фишкой по мячу
function tryLaunchSpecial(p, nx, ny) {
  const sp = specials[p.team];
  const type = sp.fire ? "fire" : (sp.ice ? "ice" : null);
  if (!type) return;
  sp[type] = false;
  updateBadges();

  let vx = ball.vx, vy = ball.vy, len = Math.hypot(vx, vy);
  if (len < 0.5) { vx = nx; vy = ny; len = 1; }
  const S = type === "fire" ? 24 : 19;
  ball.vx = vx / len * S;
  ball.vy = vy / len * S;
  ball.fx = type;
  ball.fxTeam = p.team;
  ball.fxT = 300;
  ball.trail = [];
  if (type === "fire") fireSound(); else iceSound();
}

// огненный мяч пролетает сквозь фишку соперника и отбрасывает её
function fireHit(p) {
  const len = Math.hypot(ball.vx, ball.vy) || 1;
  p.kx = ball.vx / len * 16;
  p.ky = ball.vy / len * 16;
  p.stun = 70;
  p.hitCool = 40;
  ball.vx *= 0.97; ball.vy *= 0.97;
  burnSound();
}

// ледяной мяч замораживает фишку соперника на 3 секунды
function freezePiece(p) {
  p.frozen = 180;
  p.kx = 0; p.ky = 0;
  freezeSound();
}

function updateSpecialsState() {
  for (const p of players) {
    if (p.frozen > 0) p.frozen--;
    if (p.stun > 0) p.stun--;
    if (p.hitCool > 0) p.hitCool--;
    if (Math.abs(p.kx) > 0.3 || Math.abs(p.ky) > 0.3) {
      p.x += p.kx; p.y += p.ky;
      clampPiece(p);
      p.tx = p.x; p.ty = p.y;
      p.kx *= 0.88; p.ky *= 0.88;
    } else { p.kx = 0; p.ky = 0; }
  }
}

// ---------- Физика ----------
function clampPiece(p) {
  p.x = Math.max(8+R, Math.min(W-8-R, p.x));
  p.y = Math.max(TOP+R, Math.min(BOT-R, p.y));
}

// Столкновение мяча с фишкой; (pvx,pvy) — скорость фишки за кадр
function collideBall(p, pvx, pvy) {
  const dx = ball.x - p.x, dy = ball.y - p.y;
  const d = Math.hypot(dx, dy);
  const min = R + BR;
  if (d >= min) return;

  // горящий мяч прожигает фишку соперника насквозь
  if (ball.fx === "fire" && p.team !== ball.fxTeam) {
    if ((p.hitCool || 0) <= 0) fireHit(p);
    return;
  }

  let nx, ny;
  if (d > 0.001) { nx = dx/d; ny = dy/d; }
  else { nx = 0; ny = (p.team === "blue") ? -1 : 1; }

  ball.x = p.x + nx*min;
  ball.y = p.y + ny*min;

  const rel = (ball.vx - pvx)*nx + (ball.vy - pvy)*ny;
  let impact = 0;
  if (rel < 0) {
    ball.vx -= 1.9*rel*nx;
    ball.vy -= 1.9*rel*ny;
    impact = -rel;
    kickSound(-rel);
  }
  // лёгкий «пинок», если фишка движется на мяч
  const push = pvx*nx + pvy*ny;
  if (push > 0.5) {
    ball.vx += nx*1.2;
    ball.vy += ny*1.2;
  }

  const sp = Math.hypot(ball.vx, ball.vy);
  const MAX = ball.fx ? 26 : 17;
  if (sp > MAX) { ball.vx *= MAX/sp; ball.vy *= MAX/sp; }

  if (ball.fx === "ice" && p.team !== ball.fxTeam) {
    // ледяной мяч заморозил фишку соперника
    freezePiece(p);
    ball.fx = null;
    ball.trail = [];
  } else if (!ball.fx && impact > 3 && Math.hypot(pvx, pvy) > 2) {
    // заряженный особый удар срабатывает на сильном касании своей фишкой
    tryLaunchSpecial(p, nx, ny);
  }
}

// Фишки не проходят друг сквозь друга
function separatePieces() {
  for (let i=0;i<players.length;i++) {
    for (let j=i+1;j<players.length;j++) {
      const a = players[i], b = players[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.hypot(dx,dy);
      const min = R*2;
      if (d < min) {
        const nx = d>0.001 ? dx/d : 1, ny = d>0.001 ? dy/d : 0;
        const over = min - d;
        const as = isSelected(a), bs = isSelected(b);
        if (as && !bs) { b.x += nx*over; b.y += ny*over; b.tx=b.x; b.ty=b.y; }
        else if (bs && !as) { a.x -= nx*over; a.y -= ny*over; a.tx=a.x; a.ty=a.y; }
        else {
          a.x -= nx*over/2; a.y -= ny*over/2; a.tx=a.x; a.ty=a.y;
          b.x += nx*over/2; b.y += ny*over/2; b.tx=b.x; b.ty=b.y;
        }
        clampPiece(a); clampPiece(b);
      }
    }
  }
}

// ---------- Компьютерный соперник (красная фишка сверху) ----------
function aiUpdate() {
  const p = players.find(q => q.team === "red");
  const human = players.find(q => q.team === "blue");
  // целимся в тот угол ворот, который дальше от фишки игрока
  const goalX = Math.abs(human.x - 200) > 30
    ? (human.x < 200 ? 255 : 145)
    : (ball.x < 200 ? 255 : 145);
  const goalY = BOT;                   // ворота игрока
  let tx, ty, speed = 4.8;

  if (ball.y > 430) {
    // мяч у чужих ворот — возвращаемся защищать свои
    tx = Math.max(GOAL_X1 + 20, Math.min(GOAL_X2 - 20, ball.x));
    ty = TOP + 95;
  } else {
    let ux = goalX - ball.x, uy = goalY - ball.y;
    const len = Math.hypot(ux, uy) || 1;
    ux /= len; uy /= len;
    const gap = R + BR + 4;
    const bx = ball.x - ux * gap, by = ball.y - uy * gap; // точка позади мяча
    const rx = p.x - ball.x, ry = p.y - ball.y;
    const s = rx * ux + ry * uy;                          // < 0: фишка позади мяча
    const side = rx * (-uy) + ry * ux;                    // смещение от линии удара
    if (s < -(R + BR - 6) && Math.abs(side) < 22) {
      // замах: бьём по мячу в сторону ворот игрока
      tx = ball.x + ux * 30; ty = ball.y + uy * 30; speed = 9;
    } else if (s < -10) {
      tx = bx; ty = by;
    } else {
      // фишка впереди мяча — обходим сбоку
      const sg = side >= 0 ? 1 : -1;
      tx = bx + (-uy) * sg * 70;
      ty = by + ux * sg * 70;
    }
  }

  tx = Math.max(8 + R, Math.min(W - 8 - R, tx));
  ty = Math.max(TOP + R, Math.min(BOT - R, ty));

  let dx = tx - p.x, dy = ty - p.y;
  const d = Math.hypot(dx, dy);
  if (d > speed) { dx *= speed / d; dy *= speed / d; }
  p.tx = p.x + dx;
  p.ty = p.y + dy;
}

function movePieces() {
  for (const p of players) {
    if (!isSelected(p)) { p.tx = p.x; p.ty = p.y; continue; }

    const fx = p.tx - p.x, fy = p.ty - p.y;
    const dist = Math.hypot(fx, fy);
    if (dist < 0.01) { collideBall(p, 0, 0); continue; }

    // скорость фишки за кадр (для передачи мячу), с ограничением
    let pvx = fx*0.6, pvy = fy*0.6;
    const ps = Math.hypot(pvx,pvy), PM = 16;
    if (ps > PM) { pvx *= PM/ps; pvy *= PM/ps; }

    // двигаем мелкими шагами, чтобы не «телепортироваться» сквозь мяч
    const steps = Math.max(1, Math.ceil(dist/6));
    for (let s=0; s<steps; s++) {
      p.x += fx/steps;
      p.y += fy/steps;
      clampPiece(p);
      collideBall(p, pvx, pvy);
      separatePieces();
    }
    p.tx = p.x; p.ty = p.y; // цель достигнута
  }
}

// вращение рисунка мяча по направлению движения
function spinBall() {
  const sp = Math.hypot(ball.vx, ball.vy);
  ball.rot += sp * 0.06 * (ball.vx + ball.vy * 0.3 >= 0 ? 1 : -1);
}

// мяч, влетевший в сетку: замедляется и упирается в заднюю стенку
function netBall() {
  if (!ball.inNet) return;
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.vx *= 0.9;
  ball.vy *= 0.9;
  spinBall();
  if (ball.x < GOAL_X1 + BR) { ball.x = GOAL_X1 + BR; ball.vx *= -0.4; }
  if (ball.x > GOAL_X2 - BR) { ball.x = GOAL_X2 - BR; ball.vx *= -0.4; }
  if (ball.y < BR) { ball.y = BR; ball.vy *= -0.3; }
  if (ball.y > H - BR) { ball.y = H - BR; ball.vy *= -0.3; }
}

function updateBall() {
  ball.x += ball.vx;
  ball.y += ball.vy;
  const fr = ball.fx ? 0.996 : 0.99;
  ball.vx *= fr;
  ball.vy *= fr;
  if (ball.fx) {
    ball.trail.push({x: ball.x, y: ball.y});
    if (ball.trail.length > 14) ball.trail.shift();
    ball.fxT--;
    if (ball.fxT <= 0 || Math.hypot(ball.vx, ball.vy) < 3) { ball.fx = null; ball.trail = []; }
  }
  if (Math.hypot(ball.vx, ball.vy) < 0.05) { ball.vx = 0; ball.vy = 0; }
  spinBall();

  const inMouth = ball.x > GOAL_X1 + 4 && ball.x < GOAL_X2 - 4;

  // боковые стены
  if (ball.x < 8+BR) { wallSound(Math.abs(ball.vx)); ball.x = 8+BR; ball.vx = Math.abs(ball.vx)*0.8; }
  if (ball.x > 392-BR) { wallSound(Math.abs(ball.vx)); ball.x = 392-BR; ball.vx = -Math.abs(ball.vx)*0.8; }

  // верхняя линия
  if (ball.y < TOP+BR) {
    if (inMouth) {
      if (ball.y < TOP-BR*0.5) { goal("blue"); return; }
    } else {
      wallSound(Math.abs(ball.vy));
      ball.y = TOP+BR; ball.vy = Math.abs(ball.vy)*0.8;
    }
  }
  // нижняя линия
  if (ball.y > BOT-BR) {
    if (inMouth) {
      if (ball.y > BOT+BR*0.5) { goal("red"); return; }
    } else {
      wallSound(Math.abs(ball.vy));
      ball.y = BOT-BR; ball.vy = -Math.abs(ball.vy)*0.8;
    }
  }

  // статичные фишки отбивают мяч
  for (const p of players) {
    if (!isSelected(p)) collideBall(p, 0, 0);
  }
}

// ---------- Игровой процесс ----------
function updateTimer() {
  const s = Math.floor(elapsed);
  const txt = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  const el = document.getElementById("timer");
  if (el.textContent !== txt) el.textContent = txt;
}

function resetMatch() {
  blueScore = 0; redScore = 0;
  elapsed = 0;
  specials.blue.ice = specials.blue.fire = specials.red.ice = specials.red.fire = false;
  updateBadges();
  matchOver = false;
  pauseTimer = 0;
  message = "";
  updateScore();
  updateTimer();
  resetPositions();
}

function endByTime() {
  touches.clear();
  matchOver = true;
  ball.vx = 0; ball.vy = 0;
  if (blueScore === redScore) {
    message = "Ничья! 🤝";
    tone(440, 0.2, "sine", 0.15);
    tone(330, 0.4, "sine", 0.15, null, 0.2);
  } else {
    const w = blueScore > redScore ? "blue" : "red";
    message = "Время! 🏆 " + COUNTRIES[teamCountry[w]].name;
    winSound();
  }
  pauseTimer = 150;
}

function updateScore() {
  scoreText.textContent = `${blueScore} : ${redScore}`;
}

function resetPositions() {
  players.forEach((p,i) => {
    p.x = p.tx = START[i].x;
    p.y = p.ty = START[i].y;
    p.frozen = 0; p.stun = 0; p.hitCool = 0; p.kx = 0; p.ky = 0;
  });
  ball.x = 200; ball.y = 350; ball.vx = 0; ball.vy = 0;
  ball.inNet = false;
  ball.fx = null; ball.trail = [];
  touches.clear();
}

function goal(scorer) {
  if (scorer === "blue") blueScore++; else redScore++;
  updateScore();
  touches.clear();
  ball.vx *= 0.6; ball.vy *= 0.6;
  ball.inNet = true;
  ball.fx = null; ball.trail = [];

  // особые удары: ледяной с 5-го гола, огненный с 9-го
  const sc = scorer === "blue" ? blueScore : redScore;
  let extra = "";
  if (sc === ICE_AT)  { specials[scorer].ice = true;  extra = "\n❄️ Ледяной удар!"; }
  if (sc === FIRE_AT) { specials[scorer].fire = true; extra = "\n🔥 Огненный удар!"; }
  updateBadges();

  const winner = blueScore >= WIN_SCORE ? "blue" : redScore >= WIN_SCORE ? "red" : null;
  if (winner) {
    message = "🏆 " + COUNTRIES[teamCountry[winner]].name + " победила!";
    matchOver = true;
    pauseTimer = 150;
    winSound();
  } else {
    message = "ГОЛ! " + COUNTRIES[teamCountry[scorer]].emoji + extra;
    pauseTimer = extra ? 100 : 60;
    goalSound();
  }
}

function afterPause() {
  if (matchOver) {
    resetMatch();
    return;
  }
  message = "";
  resetPositions();
}

function updateTools() {
  document.getElementById("modeBtn").textContent = mode === "ai" ? "🤖 Против ПК" : "👥 Вдвоём";
  document.getElementById("sndBtn").textContent = muted ? "🔇" : "🔊";
}
document.getElementById("modeBtn").addEventListener("click", () => {
  initAudio();
  mode = mode === "ai" ? "pvp" : "ai";
  updateTools();
  resetMatch();
});
document.getElementById("sndBtn").addEventListener("click", () => {
  initAudio();
  muted = !muted;
  updateTools();
  if (!muted) tone(440, 0.1, "sine", 0.15);
});

function loop(ts) {
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
  lastTs = ts || 0;

  if (pickerOpen) {
    // пока открыт выбор страны — игра на паузе
  } else if (pauseTimer > 0) {
    pauseTimer--;
    netBall();
    if (pauseTimer === 0) afterPause();
  } else {
    updateSpecialsState();
    if (mode === "ai") aiUpdate();
    movePieces();
    updateBall();
    if (pauseTimer === 0) {
      elapsed += dt;
      updateTimer();
    }
  }
  draw();
  requestAnimationFrame(loop);
}

updateTeamLabels();
updateScore();
updateTimer();
updateTools();
loop();
</script>
